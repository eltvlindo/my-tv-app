name: Actualizador de TV Automatico

on:
  schedule:
    - cron: '0 0,12 * * *' # Esto significa: Ejecutar cada 12 horas
  workflow_dispatch: # Esto te pone un botón para que lo corras manualmente cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar los archivos
      uses: actions/checkout@v3

    - name: Preparar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar herramientas
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps chromium

    - name: Ejecutar el cazador
      run: python tv.py

    - name: Guardar la lista de TV actualizada
      run: |
        git config --global user.name 'Robot'
        git config --global user.email 'robot@github.com'
        git add mi_tv.m3u
        git commit -m "Lista de canales actualizada automaticamente" || echo "Sin cambios"
        git push
